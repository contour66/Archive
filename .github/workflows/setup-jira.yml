name: Setup Jira Tickets

on:
  push:
    branches:
      - main
    paths:
      - 'docs/DSCE_Jira_Tickets.md'
      - '.github/workflows/setup-jira.yml'

jobs:
  create-jira-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install apify-client dotenv

      - name: Check if tickets already exist
        id: check
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          # Check if Epic already exists
          response=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/search?jql=project=DSCE+AND+type=Epic+AND+summary~'Research Agent'")

          total=$(echo $response | jq -r '.total')

          if [ "$total" -gt 0 ]; then
            echo "tickets_exist=true" >> $GITHUB_OUTPUT
            echo "✅ Tickets already exist, skipping creation"
          else
            echo "tickets_exist=false" >> $GITHUB_OUTPUT
            echo "📝 No tickets found, will create them"
          fi

      - name: Create Jira tickets
        if: steps.check.outputs.tickets_exist == 'false'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          node scripts/create-jira-tickets.js

      - name: Comment on commit
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Jira tickets created successfully! View at: https://dappersingh.atlassian.net/'
            })
